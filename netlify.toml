# Playday — static output; the only build step writes config.js from FIREBASE_* env vars.
[build]
  publish = "."
  command = "npm run build"

# the front page at /, the app on its own paths
[[redirects]]
  from = "/calendar"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/cal"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/tasks"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/tasks/*"
  to = "/app.html"
  status = 200

# nothing else should 404 into the void
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self' blob:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://www.gstatic.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# the worker must never be cached, or updates never land
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# HTML and the manifest revalidate; the worker handles offline anyway
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
